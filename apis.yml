aid: xage
name: Xage
description: 'Xage Security is a Palo Alto, California zero trust access and protection
  company whose Xage Fabric Platform enforces identity-based access control across
  operational technology (OT), IT, cloud and edge environments — covering privileged
  access management, secure remote access, VPN replacement, zero trust segmentation,
  critical asset protection and zero trust data exchange for critical infrastructure
  operators in energy, utilities, manufacturing, oil and gas, transportation, defense,
  government and space. Xage also markets a control layer that governs how AI agents
  reach resources over MCP, A2A and REST APIs. The Fabric Manager exposes a REST API
  that third-party platforms integrate against, but its reference documentation is
  published only inside the customer-authenticated Xage support portal.'
