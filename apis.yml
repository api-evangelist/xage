x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Xage's own support page tells you the documentation library lives inside the Xage support
    portal, and that portal's Zendesk Help Center API answers anonymously with HTTP 401
    "Couldn't authenticate you" — so the Fabric Manager REST API that partners such as Axonius
    integrate against has no readable public reference, base URL or spec; docs.xage.com resolves
    in DNS but has no listener on 80 or 443.
